<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaOS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="welcome-screen">

        <div class="status">
            <span>● SYSTEM ONLINE</span>
            <span>WEBOS v1.0</span>
        </div>

        <section class="welcome-card">

            <div class="logo">
                N
            </div>

            <p class="small-text">WELCOME TO</p>

            <h1>Nova<span>OS</span></h1>

            <p class="description">
                A personal web operating system built to explore,
                create, learn and experiment.
            </p>

            <div class="profile">
                <div class="avatar">
                    T
                </div>

                <div>
                    <strong>Tanmay</strong>
                    <p>Developer • Builder • Learner</p>
                </div>
            </div>

            <div class="links">
                <a href="https://github.com/Tan5dev" target="_blank">
                    GitHub
                </a>

                <a href="#" onclick="alert('NovaOS is under construction 🚀')">
                    Projects
                </a>

                <a href="#" onclick="alert('More about Tanmay coming soon!')">
                    About
                </a>
            </div>

            <button class="enter-button" onclick="enterOS()">
                Enter NovaOS
                <span>→</span>
            </button>

        </section>

        <p class="footer">
            Built with HTML • CSS • JavaScript
        </p>

    </main>

    <script>
        function enterOS() {
            alert("NovaOS is starting... 🚀");
        }
    </script>

</body>
</html>
